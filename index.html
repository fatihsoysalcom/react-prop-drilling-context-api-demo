<!DOCTYPE html>
<html>
<head>
  <title>React Prop Drilling Example</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    div { margin-bottom: 10px; padding: 10px; border-radius: 5px; }
    .prop-drilling-section { border: 2px solid #ff6347; background-color: #ffe0d9; }
    .context-api-section { border: 2px solid #4682b4; background-color: #d9eaff; }
    .component-prop-drilling { border: 1px dashed #ff6347; background-color: #fff0ed; }
    .component-context-api { border: 1px dashed #4682b4; background-color: #edf5ff; }
    h1, h2, h3, h4 { color: #333; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // 1. Create a React Context for user data
    const UserContext = React.createContext(null);

    // --- Components demonstrating Prop Drilling ---

    // ChildComponentWithProps: The deepest component that actually needs the user data.
    function ChildComponentWithProps({ user }) {
      return (
        <div className="component-prop-drilling">
          <h4>Child Component (Prop Drilling)</h4>
          <p>User Name: <strong>{user.name}</strong></p>
          <p>User Role: <strong>{user.role}</strong></p>
        </div>
      );
    }

    // IntermediateComponentWithProps: This component does NOT need 'user' data,
    // but it receives it and passes it down to its child. This is prop drilling.
    function IntermediateComponentWithProps({ user }) {
      return (
        <div className="component-prop-drilling">
          <h3>Intermediate Component (Prop Drilling)</h3>
          <p><em>I don't use user data, but I pass it along.</em></p>
          <ChildComponentWithProps user={user} /> {/* Prop is drilled down */}
        </div>
      );
    }

    // ParentComponentWithProps: Receives 'user' and passes it to its child.
    function ParentComponentWithProps({ user }) {
      return (
        <div className="component-prop-drilling">
          <h2>Parent Component (Prop Drilling)</h2>
          <IntermediateComponentWithProps user={user} /> {/* Prop is drilled down */}
        </div>
      );
    }

    // --- Components demonstrating Context API as a solution ---

    // ChildComponentWithContext: The deepest component that needs the user data.
    // It consumes the data directly from the UserContext.
    function ChildComponentWithContext() {
      const user = React.useContext(UserContext); // Consumes directly from context
      return (
        <div className="component-context-api">
          <h4>Child Component (Context API)</h4>
          <p>User Name: <strong>{user.name}</strong></p>
          <p>User Role: <strong>{user.role}</strong></p>
        </div>
      );
    }

    // IntermediateComponentWithContext: This component does NOT need 'user' data,
    // and it does NOT receive or pass it down. It's cleaner.
    function IntermediateComponentWithContext() {
      return (
        <div className="component-context-api">
          <h3>Intermediate Component (Context API)</h3>
          <p><em>I don't use user data, and I don't pass it along.</em></p>
          <ChildComponentWithContext /> {/* No props passed here for user data */}
        </div>
      );
    }

    // ParentComponentWithContext: Does not receive 'user' data directly, 
    // as it's provided by the Context API higher up.
    function ParentComponentWithContext() {
      return (
        <div className="component-context-api">
          <h2>Parent Component (Context API)</h2>
          <IntermediateComponentWithContext /> {/* No props passed here for user data */}
        </div>
      );
    }

    // App Component: The root component that holds the data and renders both examples.
    function App() {
      const userData = { name: "Alice", role: "Administrator" };

      return (
        <div>
          <h1>React Prop Drilling vs. Context API</h1>

          <div className="prop-drilling-section">
            <h2>1. Demonstrating Prop Drilling</h2>
            <p>Observe how <code>userData</code> is explicitly passed through <code>ParentComponentWithProps</code> and <code>IntermediateComponentWithProps</code>, even though the intermediate component doesn't directly use it, just to reach <code>ChildComponentWithProps</code>.</p>
            <ParentComponentWithProps user={userData} />
          </div>

          <div className="context-api-section" style={{ marginTop: '30px' }}>
            <h2>2. Solving with Context API</h2>
            <p>Here, <code>userData</code> is provided once by the <code>App</code> component using <code>UserContext.Provider</code>. The <code>ChildComponentWithContext</code> then consumes it directly using <code>React.useContext</code>, completely bypassing the intermediate components.</p>
            <UserContext.Provider value={userData}>
              <ParentComponentWithContext />
            </UserContext.Provider>
          </div>
        </div>
      );
    }

    // Render the App component into the 'root' div
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
